SDG_RELATED_INDICATORS__GLOBAL: >-
  <p>Other relevant indicators include:</p>

  <p>SDG 14.5.1 Coverage of protected areas in relation to marine areas.</p>

  <p>SDG 15.4.1 Coverage by protected areas of important sites for mountain
  biodiversity.</p>
